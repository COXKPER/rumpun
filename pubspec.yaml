name: rumpun
publish_to: none
description: A user-friendly Fediverse desktop client prototype.
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  path_provider: ^2.1.6
  sqlite3: ^3.8.0
  url_launcher: ^6.3.3
  flutter_secure_storage: ^9.2.4
  file_selector: ^1.0.3
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_linux: ^1.1.3
  media_kit_libs_android_video: ^1.3.6
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
