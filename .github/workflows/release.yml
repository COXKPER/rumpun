name: Build and Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libmpv-dev
          flutter pub get
      - name: Build Linux release
        run: flutter build linux --release
      - name: Package Linux bundle
        run: |
          mkdir -p dist
          tar -czf dist/rumpun-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/rumpun-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $releaseDir = @('build/windows/x64/runner/Release', 'build/windows/runner/Release') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $releaseDir) { throw 'Windows release bundle was not found.' }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath 'dist/rumpun-windows-x64.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/rumpun-windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release
      - name: Prepare Android asset
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/rumpun-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/rumpun-android.apk
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
      - build-android
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: List release assets
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Rumpun ${{ github.ref_name }}
          body: |
            Automated release for tag `${{ github.ref_name }}`.

            - Commit: `${{ github.sha }}`
            - Assets: Linux x64 bundle, Windows x64 bundle, Android APK
          prerelease: ${{ contains(github.ref_name, 'nightly') }}
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true
